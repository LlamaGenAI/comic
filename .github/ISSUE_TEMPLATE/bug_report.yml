name: Bug report
description: Report a reproducible bug in the SDK
labels: [bug]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Clear reproduction steps and actual result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: e.g. 2.3.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, framework, runtime.
    validations:
      required: true
